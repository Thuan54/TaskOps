# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name status.local;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server for TaskOps Status Page
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.local;

    # TLS Certificates
    ssl_certificate /etc/ssl/taskops/taskops.bundle.crt;
    ssl_certificate_key /etc/ssl/taskops/taskops.key;

    # SSL parameters & Security headers
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Document root for static status page
    root /var/www/taskops-status;
    index status.html index.html;

    # Access & error logs
    access_log /var/log/nginx/status.local.access.log;
    error_log /var/log/nginx/status.local.error.log;

    # Static file serving
    location / {
        try_files $uri $uri/ =404;
    }
}
