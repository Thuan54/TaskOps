# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name taskops.local;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server for TaskOps Web Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taskops.local;

    # TLS Certificates (generated by web/tls/gen-ca.sh)
    ssl_certificate /etc/ssl/taskops/taskops.bundle.crt;
    ssl_certificate_key /etc/ssl/taskops/taskops.key;

    # SSL parameters & Security headers
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Document root for React SPA static build
    root /var/www/taskops-app;
    index index.html;

    # Access & error logs
    access_log /var/log/nginx/taskops.local.access.log;
    error_log /var/log/nginx/taskops.local.error.log;

    # Serve static assets with cache headers
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Frontend React SPA routing (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api/ to NodeJS Express backend on 127.0.0.1:5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
