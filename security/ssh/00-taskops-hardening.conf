# G02 - SSH hardening for the personal TaskOps lab.
# Replace AllowUsers with the approved accounts before shared deployment.

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers nguyennhat
# Lynis SSH-7408: limit authentication attempts and improve logging.
MaxAuthTries 3
LogLevel VERBOSE
