# /etc/taskops-toolkit/health.conf
# Ngưỡng cảnh báo cho hệ thống Healthcheck (F12)

# Ngưỡng dung lượng đĩa (%) trên các phân vùng quan trọng
MAX_ROOT_DISK_USAGE=90
MAX_BACKUP_DISK_USAGE=85

# Các dịch vụ systemd cần giám sát trạng thái (phân tách bằng khoảng trắng)
MONITORED_SERVICES="postgresql nginx taskops-app"
