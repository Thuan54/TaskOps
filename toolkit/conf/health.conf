# /etc/taskops-toolkit/health.conf
# Cấu hình ngưỡng giám sát và kiểm tra sức khỏe hệ thống TaskOps (F12)

# Ngưỡng sử dụng CPU tối đa (%)
MAX_CPU_USAGE=80

# Ngưỡng sử dụng RAM tối đa (%)
MAX_RAM_USAGE=85

# Ngưỡng dung lượng đĩa tối đa (%) trên các phân vùng quan trọng
MAX_ROOT_DISK_USAGE=90
MAX_BACKUP_DISK_USAGE=85

# Danh sách các dịch vụ systemd cần kiểm tra trạng thái hoạt động (phân tách bằng dấu cách)
# postgresql: CSDL quan hệ
# nginx: Web server & Reverse proxy
# taskops: Ứng dụng Node.js/Express Backend (Task H01)
MONITORED_SERVICES="postgresql nginx taskops"

# Danh sách các cổng mạng TCP bắt buộc phải ở trạng thái lắng nghe (LISTEN)
# 80: HTTP (Nginx)
# 443: HTTPS (Nginx)
# 5432: PostgreSQL Database
# 5000: Node.js / Express Backend
MONITORED_PORTS="80 443 5432 5000"
